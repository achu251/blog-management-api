<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Dashboard | Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-1: #3b82f6;
            --accent-2: #8b5cf6;
            --accent-3: #10b981;
            --accent-4: #f43f5e;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            text-align: center;
            max-width: 400px;
            margin: 100px auto;
        }

        .auth-container input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            outline: none;
        }

        .auth-container button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(to right, var(--accent-1), var(--accent-2));
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .auth-container button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .dashboard-content {
            display: none; /* hidden until auth */
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
        }

        .stat-card:nth-child(1)::before { background: var(--accent-1); }
        .stat-card:nth-child(2)::before { background: var(--accent-2); }
        .stat-card:nth-child(3)::before { background: var(--accent-3); }
        .stat-card:nth-child(4)::before { background: var(--accent-4); }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .charts-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
        }

        .chart-header {
            margin-bottom: 1rem;
            color: var(--text-primary);
            font-size: 1.25rem;
            font-weight: 600;
        }
        
        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-secondary);
            display: none;
            margin-top: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="auth-section" class="auth-container">
        <h2>Dashboard Login</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 5px;">Enter your API Bearer Token</p>
        <input type="password" id="token-input" placeholder="eyJhGciOi...">
        <button onclick="loadDashboard()">Access Dashboard</button>
    </div>

    <div id="loading" class="loading">Loading Analytics Data...</div>

    <div id="dashboard-section" class="dashboard-content">
        <header>
            <h1>Your Analytics</h1>
            <button onclick="logout()" style="background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer;">Logout</button>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Posts</div>
                <div class="stat-value" id="val-posts">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Comments</div>
                <div class="stat-value" id="val-comments">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Likes Received</div>
                <div class="stat-value" id="val-likes">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Post Views</div>
                <div class="stat-value" id="val-views">0</div>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-card">
                <div class="chart-header">Engagement per Post</div>
                <canvas id="barChart"></canvas>
            </div>
            <div class="chart-card">
                <div class="chart-header">Overall Interaction</div>
                <canvas id="pieChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    let barChartInstance = null;
    let pieChartInstance = null;

    // Check for existing token
    window.onload = () => {
        const token = localStorage.getItem("blog_token");
        if(token) {
            document.getElementById("token-input").value = token;
            loadDashboard();
        }
    }

    async function loadDashboard() {
        const token = document.getElementById("token-input").value.trim();
        if(!token) {
            alert("Please enter a valid token");
            return;
        }

        document.getElementById("auth-section").style.display = "none";
        document.getElementById("loading").style.display = "block";
        document.getElementById("dashboard-section").style.display = "none";

        try {
            const response = await fetch('/users/dashboard/data', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if(!response.ok) {
                throw new Error("Invalid token or unauthorized");
            }

            const data = await response.json();
            localStorage.setItem("blog_token", token);
            
            document.getElementById("loading").style.display = "none";
            document.getElementById("dashboard-section").style.display = "block";
            
            updateUI(data);
        } catch (error) {
            alert(error.message);
            document.getElementById("loading").style.display = "none";
            document.getElementById("auth-section").style.display = "block";
            localStorage.removeItem("blog_token");
        }
    }

    function logout() {
        localStorage.removeItem("blog_token");
        document.getElementById("dashboard-section").style.display = "none";
        document.getElementById("auth-section").style.display = "block";
        document.getElementById("token-input").value = "";
    }

    function updateUI(data) {
        // Update Stats
        document.getElementById("val-posts").innerText = data.total_posts;
        document.getElementById("val-comments").innerText = data.total_comments_made;
        document.getElementById("val-likes").innerText = data.total_likes_received;
        document.getElementById("val-views").innerText = data.total_post_views;

        // Prepare Chart Data
        const labels = data.post_stats.map(p => p.post_title.length > 20 ? p.post_title.substring(0, 20) + '...' : p.post_title);
        const views = data.post_stats.map(p => p.views);
        const likes = data.post_stats.map(p => p.likes_count);
        const comments = data.post_stats.map(p => p.comments_count);

        Chart.defaults.color = '#94a3b8';
        Chart.defaults.font.family = "'Inter', sans-serif";

        // Bar Chart
        const barCtx = document.getElementById('barChart').getContext('2d');
        if(barChartInstance) barChartInstance.destroy();
        barChartInstance = new Chart(barCtx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Views',
                        data: views,
                        backgroundColor: 'rgba(59, 130, 246, 0.8)',
                        borderRadius: 4
                    },
                    {
                        label: 'Likes',
                        data: likes,
                        backgroundColor: 'rgba(16, 185, 129, 0.8)',
                        borderRadius: 4
                    },
                    {
                        label: 'Comments',
                        data: comments,
                        backgroundColor: 'rgba(244, 63, 94, 0.8)',
                        borderRadius: 4
                    }
                ]
            },
            options: {
                responsive: true,
                interaction: {
                    intersect: false,
                    mode: 'index',
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(255, 255, 255, 0.05)' }
                    },
                    x: {
                        grid: { display: false }
                    }
                },
                plugins: {
                    legend: {
                        position: 'top',
                    }
                }
            }
        });

        // Pie Chart
        const pieCtx = document.getElementById('pieChart').getContext('2d');
        if(pieChartInstance) pieChartInstance.destroy();
        
        const totalCommentsOnPosts = data.post_stats.reduce((acc, p) => acc + p.comments_count, 0);
        
        pieChartInstance = new Chart(pieCtx, {
            type: 'doughnut',
            data: {
                labels: ['Views', 'Likes', 'Comments'],
                datasets: [{
                    data: [data.total_post_views, data.total_likes_received, totalCommentsOnPosts],
                    backgroundColor: [
                        'rgba(59, 130, 246, 0.8)',
                        'rgba(16, 185, 129, 0.8)',
                        'rgba(244, 63, 94, 0.8)'
                    ],
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            },
            options: {
                responsive: true,
                cutout: '70%',
                plugins: {
                    legend: {
                        position: 'bottom'
                    }
                }
            }
        });
    }
</script>
</body>
</html>
