<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Dashboard | Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-1: #3b82f6;
            --accent-2: #8b5cf6;
            --accent-3: #10b981;
            --accent-4: #f43f5e;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        .header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
}

.notification-wrapper {
    position: relative;
}

.notification-bell {
    position: relative;
    width: 44px;
    height: 44px;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.08);
    color: white;
    font-size: 20px;
    cursor: pointer;
    transition: 0.2s ease;
}

.notification-bell:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: translateY(-1px);
}

.notification-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    min-width: 20px;
    height: 20px;
    padding: 0 5px;
    border-radius: 999px;
    background: #ef4444;
    color: white;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--bg-color);
}

.notification-badge.hidden {
    display: none;
}

.notification-dropdown {
    position: absolute;
    top: 54px;
    right: 0;
    width: 360px;
    max-width: calc(100vw - 30px);
    background: #1e293b;
    border: 1px solid var(--border-color);
    border-radius: 14px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    overflow: hidden;
    z-index: 1000;
    display: none;
}

.notification-dropdown.show {
    display: block;
}

.notification-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 16px;
    border-bottom: 1px solid var(--border-color);
}

.notification-header strong {
    font-size: 15px;
}

.mark-all-btn {
    border: none;
    background: transparent;
    color: #60a5fa;
    font-size: 12px;
    cursor: pointer;
}

.mark-all-btn:hover {
    text-decoration: underline;
}

.notification-list {
    max-height: 420px;
    overflow-y: auto;
}

.notification-item {
    padding: 14px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    cursor: pointer;
    transition: background 0.2s ease;
}

.notification-item:hover {
    background: rgba(255, 255, 255, 0.05);
}

.notification-item.unread {
    background: rgba(59, 130, 246, 0.10);
}

.notification-message {
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-primary);
}

.notification-item.unread .notification-message {
    font-weight: 700;
}

.notification-time {
    margin-top: 5px;
    color: var(--text-secondary);
    font-size: 11px;
}

.notification-type {
    display: inline-block;
    margin-bottom: 5px;
    padding: 3px 7px;
    border-radius: 999px;
    background: rgba(96, 165, 250, 0.15);
    color: #93c5fd;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

.notification-empty {
    padding: 30px 20px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 13px;
}

@media (max-width: 600px) {
    .notification-dropdown {
        right: -70px;
    }

    header {
        align-items: flex-start;
        gap: 15px;
    }

    .header-actions {
        flex-shrink: 0;
    }
}

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            text-align: center;
            max-width: 400px;
            margin: 100px auto;
        }

        .auth-container input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            outline: none;
        }

        .auth-container button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(to right, var(--accent-1), var(--accent-2));
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .auth-container button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .dashboard-content {
            display: none; /* hidden until auth */
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
        }

        .stat-card:nth-child(1)::before { background: var(--accent-1); }
        .stat-card:nth-child(2)::before { background: var(--accent-2); }
        .stat-card:nth-child(3)::before { background: var(--accent-3); }
        .stat-card:nth-child(4)::before { background: var(--accent-4); }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .charts-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
        }

        .chart-header {
            margin-bottom: 1rem;
            color: var(--text-primary);
            font-size: 1.25rem;
            font-weight: 600;
        }
        
        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-secondary);
            display: none;
            margin-top: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="auth-section" class="auth-container">
        <h2>Dashboard Login</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 5px;">Enter your API Bearer Token</p>
        <input type="password" id="token-input" placeholder="eyJhGciOi...">
        <button onclick="loadDashboard()">Access Dashboard</button>
    </div>

    <div id="loading" class="loading">Loading Analytics Data...</div>

    <div id="dashboard-section" class="dashboard-content">
        
            <header>
    <h1>Your Analytics</h1>

    <div class="header-actions">

        <div class="notification-wrapper">

            <button
                id="notification-bell"
                class="notification-bell"
                onclick="toggleNotifications()"
                title="Notifications"
            >
                🔔
                <span
                    id="notification-badge"
                    class="notification-badge"
                >
                    0
                </span>
            </button>

            <div
                id="notification-dropdown"
                class="notification-dropdown"
            >

                <div class="notification-header">
                    <strong>Notifications</strong>

                    <button
                        onclick="markAllNotificationsRead()"
                        class="mark-all-btn"
                    >
                        Mark all read
                    </button>
                </div>

                <div
                    id="notification-list"
                    class="notification-list"
                >
                    <div class="notification-empty">
                        Loading notifications...
                    </div>
                </div>

            </div>

        </div>

        <button
            onclick="logout()"
            style="background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer;"
        >
            Logout
        </button>

    </div>
</header>
        

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Posts</div>
                <div class="stat-value" id="val-posts">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Comments</div>
                <div class="stat-value" id="val-comments">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Likes Received</div>
                <div class="stat-value" id="val-likes">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Post Views</div>
                <div class="stat-value" id="val-views">0</div>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-card">
                <div class="chart-header">Engagement per Post</div>
                <canvas id="barChart"></canvas>
            </div>
            <div class="chart-card">
                <div class="chart-header">Overall Interaction</div>
                <canvas id="pieChart"></canvas>
            </div>
        </div>
    </div>
</div>


<script>
    let barChartInstance = null;
    let pieChartInstance = null;

    // Check for existing token
    window.onload = () => {
        const token = localStorage.getItem("blog_token");
        if(token) {
            document.getElementById("token-input").value = token;
            loadDashboard();
             loadNotifications();
        }
    }

    async function loadDashboard() {
        const token = document.getElementById("token-input").value.trim();
        if(!token) {
            alert("Please enter a valid token");
            return;
        }

        document.getElementById("auth-section").style.display = "none";
        document.getElementById("loading").style.display = "block";
        document.getElementById("dashboard-section").style.display = "none";

        try {
            const response = await fetch('/users/dashboard/data', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if(!response.ok) {
                throw new Error("Invalid token or unauthorized");
            }

            const data = await response.json();
            localStorage.setItem("blog_token", token);
            
            document.getElementById("loading").style.display = "none";
            document.getElementById("dashboard-section").style.display = "block";
            
            updateUI(data);
        } catch (error) {
            alert(error.message);
            document.getElementById("loading").style.display = "none";
            document.getElementById("auth-section").style.display = "block";
            localStorage.removeItem("blog_token");
        }
    }

    function logout() {
        localStorage.removeItem("blog_token");
        document.getElementById("dashboard-section").style.display = "none";
        document.getElementById("auth-section").style.display = "block";
        document.getElementById("token-input").value = "";
    }

    function updateUI(data) {
        async function loadNotifications() {
    const token = localStorage.getItem("blog_token");

    if (!token) {
        return;
    }

    try {
        const response = await fetch("/notifications/", {
            headers: {
                "Authorization": `Bearer ${token}`
            }
        });

        if (!response.ok) {
            throw new Error("Unable to load notifications");
        }

        const notifications = await response.json();

        renderNotifications(notifications);

        const unreadCount = notifications.filter(
            notification => !notification.is_read
        ).length;

        updateNotificationBadge(unreadCount);

    } catch (error) {
        console.error("Notification error:", error);
    }
}


function renderNotifications(notifications) {

    const list = document.getElementById("notification-list");

    if (!notifications.length) {
        list.innerHTML = `
            <div class="notification-empty">
                No notifications yet.
            </div>
        `;

        updateNotificationBadge(0);
        return;
    }

    list.innerHTML = notifications.map(notification => {

        const date = new Date(notification.created_at);

        const formattedTime = date.toLocaleString();

        const typeLabel =
            notification.notification_type
                .replaceAll("_", " ");

        return `
            <div
                class="notification-item ${notification.is_read ? "" : "unread"}"
                onclick="markNotificationRead(${notification.id})"
            >

                <div class="notification-type">
                    ${escapeHtml(typeLabel)}
                </div>

                <div class="notification-message">
                    ${escapeHtml(notification.message)}
                </div>

                <div class="notification-time">
                    ${escapeHtml(formattedTime)}
                </div>

            </div>
        `;

    }).join("");
}


function updateNotificationBadge(count) {

    const badge = document.getElementById("notification-badge");

    if (!badge) {
        return;
    }

    if (count > 0) {
        badge.textContent = count > 99 ? "99+" : count;
        badge.classList.remove("hidden");
    } else {
        badge.textContent = "0";
        badge.classList.add("hidden");
    }
}


function toggleNotifications() {

    const dropdown = document.getElementById(
        "notification-dropdown"
    );

    if (!dropdown) {
        return;
    }

    dropdown.classList.toggle("show");

    if (dropdown.classList.contains("show")) {
        loadNotifications();
    }
}


async function markNotificationRead(notificationId) {

    const token = localStorage.getItem("blog_token");

    if (!token) {
        return;
    }

    try {

        const response = await fetch(
            `/notifications/${notificationId}/read`,
            {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            }
        );

        if (!response.ok) {
            throw new Error("Unable to mark notification as read");
        }

        await loadNotifications();

    } catch (error) {
        console.error("Mark notification read error:", error);
    }
}


async function markAllNotificationsRead() {

    const token = localStorage.getItem("blog_token");

    if (!token) {
        return;
    }

    try {

        const response = await fetch(
            "/notifications/read",
            {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            }
        );

        if (!response.ok) {
            throw new Error("Unable to mark notifications as read");
        }

        await loadNotifications();

    } catch (error) {
        console.error("Mark all notifications error:", error);
    }
}


function escapeHtml(value) {

    const div = document.createElement("div");

    div.textContent = value;

    return div.innerHTML;
}
        // Update Stats
        document.getElementById("val-posts").innerText = data.total_posts;
        document.getElementById("val-comments").innerText = data.total_comments_made;
        document.getElementById("val-likes").innerText = data.total_likes_received;
        document.getElementById("val-views").innerText = data.total_post_views;

        // Prepare Chart Data
        const labels = data.post_stats.map(p => p.post_title.length > 20 ? p.post_title.substring(0, 20) + '...' : p.post_title);
        const views = data.post_stats.map(p => p.views);
        const likes = data.post_stats.map(p => p.likes_count);
        const comments = data.post_stats.map(p => p.comments_count);

        Chart.defaults.color = '#94a3b8';
        Chart.defaults.font.family = "'Inter', sans-serif";

        // Bar Chart
        const barCtx = document.getElementById('barChart').getContext('2d');
        if(barChartInstance) barChartInstance.destroy();
        barChartInstance = new Chart(barCtx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Views',
                        data: views,
                        backgroundColor: 'rgba(59, 130, 246, 0.8)',
                        borderRadius: 4
                    },
                    {
                        label: 'Likes',
                        data: likes,
                        backgroundColor: 'rgba(16, 185, 129, 0.8)',
                        borderRadius: 4
                    },
                    {
                        label: 'Comments',
                        data: comments,
                        backgroundColor: 'rgba(244, 63, 94, 0.8)',
                        borderRadius: 4
                    }
                ]
            },
            options: {
                responsive: true,
                interaction: {
                    intersect: false,
                    mode: 'index',
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(255, 255, 255, 0.05)' }
                    },
                    x: {
                        grid: { display: false }
                    }
                },
                plugins: {
                    legend: {
                        position: 'top',
                    }
                }
            }
        });

        // Pie Chart
        const pieCtx = document.getElementById('pieChart').getContext('2d');
        if(pieChartInstance) pieChartInstance.destroy();
        
        const totalCommentsOnPosts = data.post_stats.reduce((acc, p) => acc + p.comments_count, 0);
        
        pieChartInstance = new Chart(pieCtx, {
            type: 'doughnut',
            data: {
                labels: ['Views', 'Likes', 'Comments'],
                datasets: [{
                    data: [data.total_post_views, data.total_likes_received, totalCommentsOnPosts],
                    backgroundColor: [
                        'rgba(59, 130, 246, 0.8)',
                        'rgba(16, 185, 129, 0.8)',
                        'rgba(244, 63, 94, 0.8)'
                    ],
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            },
            options: {
                responsive: true,
                cutout: '70%',
                plugins: {
                    legend: {
                        position: 'bottom'
                    }
                }
            }
        });
    }
    document.addEventListener("click", function(event) {

    const wrapper = document.querySelector(
        ".notification-wrapper"
    );

    const dropdown = document.getElementById(
        "notification-dropdown"
    );

    if (!wrapper || !dropdown) {
        return;
    }

    if (!wrapper.contains(event.target)) {
        dropdown.classList.remove("show");
    }
});
</script>
</body>
</html>
